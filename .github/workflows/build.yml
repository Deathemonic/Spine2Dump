name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        type: string
      prerelease:
        type: boolean
        default: false
      verify:
        type: boolean
        default: false

jobs:
  build:
    name: Build for ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: linux-x86_64, os: ubuntu-latest, binary: spine2dump, libc: glibc }
          - { name: linux-x86_64-musl, os: ubuntu-latest, binary: spine2dump, libc: musl }
          - { name: windows-x86_64, os: windows-latest, binary: spine2dump.exe }
          - { name: macos-x86_64, os: macos-15-intel, binary: spine2dump }
          - { name: macos-aarch64, os: macos-latest, binary: spine2dump }
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup xmake
        if: matrix.config.libc != 'musl'
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          build-cache: true
          project-path: '.'

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          path-type: inherit
          update: true
          install: >-
            git
            make
            nasm
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm-openmp
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-x264

      - name: Install dependencies (Linux glibc)
        if: runner.os == 'Linux' && matrix.config.libc == 'glibc'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1-mesa-dev libgl1-mesa-dev libomp-dev

      - name: Build (Linux glibc)
        if: runner.os == 'Linux' && matrix.config.libc == 'glibc'
        run: |
          xmake f -y -v --toolchain=clang --ffmpeg=y --gpl=y
          xmake -y -v -j$(nproc)
          xmake install -o dist

      - name: Build (Linux musl)
        if: runner.os == 'Linux' && matrix.config.libc == 'musl'
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e XMAKE_ROOT=y alpine:edge sh -lc '
            apk add --no-cache \
              build-base \
              clang \
              curl \
              git \
              mesa-dev \
              openmp-dev \
              p7zip \
              perl \
              unzip \
              xmake \
              zlib-dev \
              zlib-static &&
            xmake f -y -v --toolchain=clang --static=y --ffmpeg=y --gpl=y &&
            xmake -y -v -j$(nproc) &&
            xmake install -o dist
          '

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          xmake f -y -v --toolchain=clang --static=y --ffmpeg=y --gpl=y
          xmake -y -v -j$(nproc)
          xmake install -o dist

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm nasm
          LLVM_PREFIX="$(brew --prefix llvm)"
          export PATH="${LLVM_PREFIX}/bin:${PATH}"
          xmake f -y -v --toolchain=clang --cc="${LLVM_PREFIX}/bin/clang" --cxx="${LLVM_PREFIX}/bin/clang++" --ffmpeg=y --gpl=y
          xmake -y -v -j$(sysctl -n hw.ncpu)
          xmake install -o dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: spine2dump-${{ matrix.config.name }}
          path: dist/bin/*

  verify:
    name: Verify ${{ matrix.config.name }}
    needs: [build]
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: linux-x86_64, os: ubuntu-latest, binary: spine2dump, libc: glibc }
          - { name: linux-x86_64-musl, os: ubuntu-latest, binary: spine2dump, libc: musl }
          - { name: windows-x86_64, os: windows-latest, binary: spine2dump.exe }
          - { name: macos-x86_64, os: macos-15-intel, binary: spine2dump }
          - { name: macos-aarch64, os: macos-latest, binary: spine2dump }
    steps:
      - name: Skip Verify
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.verify }}
        run: echo "Verification disabled."

      - name: Download Artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify }}
        uses: actions/download-artifact@v7
        with:
          name: spine2dump-${{ matrix.config.name }}
          path: verify

      - name: Verify (Linux glibc)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify && runner.os == 'Linux' && matrix.config.libc == 'glibc' }}
        run: |
          chmod +x verify/${{ matrix.config.binary }}
          docker run --rm -v "$PWD/verify:/app:ro" ubuntu:24.04 bash -lc '
            export DEBIAN_FRONTEND=noninteractive &&
            apt-get update -qq &&
            apt-get install -y --no-install-recommends binutils libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri >/dev/null &&
            readelf -d /app/${{ matrix.config.binary }} | grep NEEDED || true &&
            /app/${{ matrix.config.binary }} --help
          '

      - name: Verify (Linux musl)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify && runner.os == 'Linux' && matrix.config.libc == 'musl' }}
        run: |
          chmod +x verify/${{ matrix.config.binary }}
          docker run --rm -v "$PWD/verify:/app:ro" alpine:3.20 sh -lc '
            apk add --no-cache binutils mesa-egl mesa-gl mesa-dri-gallium libc6-compat >/dev/null &&
            readelf -d /app/${{ matrix.config.binary }} | grep NEEDED || true &&
            /app/${{ matrix.config.binary }} --help
          '

      - name: Verify (Windows)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify && runner.os == 'Windows' }}
        shell: bash
        run: |
          ls -l verify
          if command -v objdump >/dev/null; then
            objdump -p verify/${{ matrix.config.binary }} | grep "DLL Name" || true
          elif command -v llvm-objdump >/dev/null; then
            llvm-objdump -p verify/${{ matrix.config.binary }} | grep "DLL Name" || true
          fi
          ./verify/${{ matrix.config.binary }} --help

      - name: Verify (macOS)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify && runner.os == 'macOS' }}
        run: |
          chmod +x verify/${{ matrix.config.binary }}
          otool -L verify/${{ matrix.config.binary }}
          ./verify/${{ matrix.config.binary }} --help

  deploy:
    name: Release
    needs: [build, verify]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        if: inputs.tag != ''
        uses: actions/checkout@v6

      - name: Create tag
        if: inputs.tag != ''
        run: |
          git tag ${{ inputs.tag }}
          git push origin ${{ inputs.tag }}

      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./artifacts

      - name: Package
        run: |
          cd artifacts
          for dir in */; do
            dir_name=${dir%/}
            cd "$dir"
            zip "../${dir_name}.zip" ./*
            cd ..
          done

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*.zip
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}